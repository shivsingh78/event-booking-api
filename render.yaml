services:
  # Web API Service
  - type: web
    name: event-booking-api
    env: node
    plan: starter
    buildCommand: pnpm install && pnpm build && pnpm migrate
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: event-booking-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: event-booking-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ORGANIZER_INVITE_TOKEN
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      - key: DATABASE_POOL_MAX
        value: "25"
      - key: BOOKING_RATE_LIMIT_PER_MINUTE
        value: "5000"

  # Background Queue Worker
  - type: worker
    name: event-booking-worker
    env: node
    plan: starter
    buildCommand: pnpm install && pnpm build
    startCommand: node dist/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: event-booking-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: event-booking-redis
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: onboarding@resend.dev

databases:
  - name: event-booking-db
    databaseName: event_booking
    user: event_booking_user
    plan: starter