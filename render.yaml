services:
  # Web API Service
  - type: web
    name: event-booking-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: node dist/db/migrate.js
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: event-booking-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: event-booking-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ORGANIZER_INVITE_TOKEN
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DATABASE_POOL_MAX
        value: "25"
      - key: BOOKING_RATE_LIMIT_PER_MINUTE
        value: "5000"

  # Background Queue Worker
  - type: worker
    name: event-booking-worker
    runtime: node
    plan: 0.5c-512mb
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: event-booking-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: event-booking-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          name: event-booking-api
          type: web
          envVarKey: JWT_SECRET
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  # Key Value / Redis Instance
  - type: keyvalue
    name: event-booking-redis
    plan: free
    # The API and worker connect over Render's private network only.
    ipAllowList: []

databases:
  - name: event-booking-db
    databaseName: event_booking
    user: event_booking_user
    plan: 0.5c-1g
